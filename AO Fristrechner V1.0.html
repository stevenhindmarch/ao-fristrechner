<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1d4ed8">
<title>AO Fristrechner</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f2f4f7;
    color: #1f2937;
}

.app {
    max-width: 520px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 24px 18px 40px;
}

header {
    text-align: center;
    margin-bottom: 24px;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 6px 0 0;
    color: #6b7280;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 3px 14px rgba(0,0,0,0.07);
}

label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
}

select,
input[type="date"] {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 11px;
    font-size: 16px;
    background: white;
    margin-bottom: 18px;
}

button {
    width: 100%;
    border: 0;
    border-radius: 13px;
    padding: 15px;
    font-size: 17px;
    font-weight: 700;
    background: #1d4ed8;
    color: white;
    cursor: pointer;
}

button:active {
    transform: scale(0.99);
}

.result {
    display: none;
}

.result-row {
    padding: 13px 0;
    border-bottom: 1px solid #e5e7eb;
}

.result-row:last-child {
    border-bottom: none;
}

.result-label {
    color: #6b7280;
    font-size: 14px;
}

.result-value {
    font-size: 21px;
    font-weight: 700;
    margin-top: 3px;
}

.status {
    text-align: center;
    padding: 15px;
    border-radius: 12px;
    margin-top: 16px;
    font-weight: 700;
}

.green {
    background: #dcfce7;
    color: #166534;
}

.yellow {
    background: #fef3c7;
    color: #92400e;
}

.red {
    background: #fee2e2;
    color: #991b1b;
}

details {
    margin-top: 16px;
}

summary {
    cursor: pointer;
    font-weight: 600;
}

.explanation {
    margin-top: 12px;
    line-height: 1.55;
    color: #4b5563;
}

.small {
    font-size: 13px;
    color: #6b7280;
    line-height: 1.5;
}

footer {
    text-align: center;
    color: #9ca3af;
    font-size: 12px;
    margin-top: 25px;
}
</style>

</head>

<body>

<div class="app">

<header>
    <h1>⚖️ AO Fristrechner</h1>
    <p>Einspruchsfrist nach der AO</p>
</header>

<div class="card">


<label for="bundesland">Bundesland</label>

<select id="bundesland">
    <option value="BW">Baden-Württemberg</option>
    <option value="BY">Bayern</option>
    <option value="BE">Berlin</option>
    <option value="BB">Brandenburg</option>
    <option value="HB" selected>Bremen</option>
    <option value="HH">Hamburg</option>
    <option value="HE">Hessen</option>
    <option value="MV">Mecklenburg-Vorpommern</option>
    <option value="NI">Niedersachsen</option>
    <option value="NW">Nordrhein-Westfalen</option>
    <option value="RP">Rheinland-Pfalz</option>
    <option value="SL">Saarland</option>
    <option value="SN">Sachsen</option>
    <option value="ST">Sachsen-Anhalt</option>
    <option value="SH">Schleswig-Holstein</option>
    <option value="TH">Thüringen</option>
</select>

<label for="postdatum">Aufgabe zur Post</label>

<input
    type="date"
    id="postdatum"
    onkeydown="if(event.key === 'Enter') berechnen()"
>

<button onclick="berechnen()">FRIST BERECHNEN</button>


</div>

<div class="card result" id="result">

<div class="result-row">
    <div class="result-label">Bekanntgabe</div>
    <div class="result-value" id="bekanntgabe"></div>
</div>

<div class="result-row">
    <div class="result-label">Fristbeginn</div>
    <div class="result-value" id="fristbeginn"></div>
</div>

<div class="result-row">
    <div class="result-label">Fristende</div>
    <div class="result-value" id="fristende"></div>
</div>

<div class="status" id="status"></div>

<details>
    <summary>Berechnung anzeigen</summary>

    <div class="explanation" id="erklaerung"></div>
</details>


</div>

<div class="card">


<strong>ℹ️ Rechtsgrundlage</strong>

<p class="small">
    Berechnung nach § 122 Abs. 2 AO,
    § 108 AO und § 355 AO.
    Die App verwendet die seit 01.01.2025 geltende
    Vier-Tage-Bekanntgabefiktion.
</p>


</div>

<footer>
    AO Fristrechner – Version 1.0
</footer>

</div>

<script>

/*
=========================================================
FEIERTAGE
=========================================================
*/

const feiertage = {

    "BW": ["01-01","01-06","05-01","10-03","11-01","12-25","12-26"],
    "BY": ["01-01","01-06","05-01","08-15","10-03","11-01","12-25","12-26"],
    "BE": ["01-01","05-01","10-03","12-25","12-26"],
    "BB": ["01-01","05-01","10-03","10-31","12-25","12-26"],
    "HB": ["01-01","05-01","10-03","10-31","12-25","12-26"],
    "HH": ["01-01","05-01","10-03","10-31","12-25","12-26"],
    "HE": ["01-01","05-01","10-03","12-25","12-26"],
    "MV": ["01-01","05-01","10-03","10-31","12-25","12-26"],
    "NI": ["01-01","05-01","10-03","10-31","12-25","12-26"],
    "NW": ["01-01","05-01","10-03","11-01","12-25","12-26"],
    "RP": ["01-01","05-01","10-03","11-01","12-25","12-26"],
    "SL": ["01-01","05-01","10-03","11-01","12-25","12-26"],
    "SN": ["01-01","05-01","10-03","10-31","11-01","12-25","12-26"],
    "ST": ["01-01","05-01","10-03","10-31","12-25","12-26"],
    "SH": ["01-01","05-01","10-03","10-31","12-25","12-26"],
    "TH": ["01-01","05-01","10-03","10-31","12-25","12-26"]

};


/*
=========================================================
DATUM AUSGEBEN
=========================================================
*/

function formatDatum(d) {

    return d.toLocaleDateString("de-DE", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
    });

}


/*
=========================================================
OSTERSONNTAG BERECHNEN
=========================================================
*/

function ostersonntag(jahr) {

    const a = jahr % 19;
    const b = Math.floor(jahr / 100);
    const c = jahr % 100;
    const d = Math.floor(b / 4);
    const e = b % 4;
    const f = Math.floor((b + 8) / 25);
    const g = Math.floor((b - f + 1) / 3);
    const h = (19*a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4);
    const k = c % 4;
    const l = (32 + 2*e + 2*i - h - k) % 7;
    const m = Math.floor((a + 11*h + 22*l) / 451);

    const monat = Math.floor((h + l - 7*m + 114) / 31);
    const tag = ((h + l - 7*m + 114) % 31) + 1;

    return new Date(jahr, monat - 1, tag);
}


/*
=========================================================
FEIERTAG PRÜFEN
=========================================================
*/

function istFeiertag(datum, bundesland) {

    const jahr = datum.getFullYear();

    const ostern = ostersonntag(jahr);

    const beweglicheFeiertage = [

        // Karfreitag
        new Date(ostern.getTime() - 2 * 86400000),

        // Ostermontag
        new Date(ostern.getTime() + 1 * 86400000),

        // Christi Himmelfahrt
        new Date(ostern.getTime() + 39 * 86400000),

        // Pfingstmontag
        new Date(ostern.getTime() + 50 * 86400000)

    ];

    const md =
        String(datum.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(datum.getDate()).padStart(2, "0");

    if (feiertage[bundesland].includes(md)) {
        return true;
    }

    return beweglicheFeiertage.some(d =>
        d.getFullYear() === datum.getFullYear() &&
        d.getMonth() === datum.getMonth() &&
        d.getDate() === datum.getDate()
    );

}


/*
=========================================================
WERKTAG PRÜFEN
=========================================================
*/

function istWerktag(datum, bundesland) {

    const tag = datum.getDay();

    // Sonntag
    if (tag === 0) {
        return false;
    }

    // Samstag
    if (tag === 6) {
        return false;
    }

    return !istFeiertag(datum, bundesland);

}


/*
=========================================================
NÄCHSTER WERKTAG
=========================================================
*/

function naechsterWerktag(datum, bundesland) {

    const d = new Date(datum);

    while (!istWerktag(d, bundesland)) {

        d.setDate(d.getDate() + 1);

    }

    return d;

}


/*
=========================================================
EINEN MONAT HINZUFÜGEN
=========================================================
*/

function addMonat(datum) {

    const d = new Date(datum);

    const tag = d.getDate();

    d.setMonth(d.getMonth() + 1);

    /*
       Falls der Folgemonat den Tag nicht besitzt,
       auf den letzten Tag des Folgemonats gehen.
    */

    if (d.getDate() !== tag) {

        d.setDate(0);

    }

    return d;

}


/*
=========================================================
FRIST BERECHNEN
=========================================================
*/

function berechnen() {

    const eingabe =
        document.getElementById("postdatum").value;

    const bundesland =
        document.getElementById("bundesland").value;


    if (!eingabe) {

        alert(
            "Bitte zuerst das Datum der Aufgabe zur Post eingeben."
        );

        return;

    }


    const [jahr, monat, tag] =
        eingabe.split("-").map(Number);


    const postdatum =
        new Date(jahr, monat - 1, tag);


    /*
    -----------------------------------------------------
    1. BEKANNTGABE
       § 122 Abs. 2 AO

       Vier Tage nach Aufgabe zur Post.

       Wichtig:
       Der Bekanntgabetag wird NICHT wegen Samstag,
       Sonntag oder Feiertag verschoben.
    -----------------------------------------------------
    */

    const bekanntgabe =
        new Date(postdatum);

    bekanntgabe.setDate(
        bekanntgabe.getDate() + 4
    );


    /*
    -----------------------------------------------------
    2. FRISTBEGINN
       § 108 Abs. 1 AO i.V.m. § 187 BGB

       Der Tag der Bekanntgabe wird nicht mitgerechnet.
       Die Frist beginnt am Folgetag.
    -----------------------------------------------------
    */

    const fristbeginn =
        new Date(bekanntgabe);

    fristbeginn.setDate(
        fristbeginn.getDate() + 1
    );


    /*
    -----------------------------------------------------
    3. FRISTENDE
       § 355 AO

       Einspruchsfrist = ein Monat.

       Bei einer Monatsfrist endet die Frist
       grundsätzlich am Tag vor dem entsprechenden
       Kalendertag des Folgemonats.
    -----------------------------------------------------
    */

    let fristende =
        addMonat(fristbeginn);

    fristende.setDate(
        fristende.getDate() - 1
    );


    /*
    -----------------------------------------------------
    4. § 108 Abs. 3 AO

       Nur wenn das ENDE der Frist auf

       - Samstag
       - Sonntag
       - gesetzlichen Feiertag

       fällt, wird auf den nächsten Werktag verschoben.
    -----------------------------------------------------
    */

    let fristendeVerschoben = false;

    if (!istWerktag(fristende, bundesland)) {

        fristende =
            naechsterWerktag(
                fristende,
                bundesland
            );

        fristendeVerschoben = true;

    }


    /*
    -----------------------------------------------------
    AUSGABE
    -----------------------------------------------------
    */

    document.getElementById("bekanntgabe").textContent =
        formatDatum(bekanntgabe);


    document.getElementById("fristbeginn").textContent =
        formatDatum(fristbeginn);


    document.getElementById("fristende").textContent =
        formatDatum(fristende);


    /*
    -----------------------------------------------------
    COUNTDOWN
    -----------------------------------------------------
    */

    const heute = new Date();

    heute.setHours(0, 0, 0, 0);


    const diff =
        Math.ceil(
            (fristende - heute) / 86400000
        );


    const status =
        document.getElementById("status");


    status.className = "status";


    if (diff < 0) {

        status.classList.add("red");

        status.textContent =
            "🔴 FRIST ABGELAUFEN";

    }

    else if (diff <= 7) {

        status.classList.add("yellow");

        status.textContent =
            "🟡 FRIST LÄUFT BALD AB – noch " +
            diff +
            " Tage";

    }

    else {

        status.classList.add("green");

        status.textContent =
            "🟢 FRIST LÄUFT – noch " +
            diff +
            " Tage";

    }


    /*
    -----------------------------------------------------
    BERECHNUNGSERKLÄRUNG
    -----------------------------------------------------
    */

    let text = `

        <strong>1. Bekanntgabe (§ 122 Abs. 2 AO)</strong><br>

        Aufgabe zur Post:
        ${formatDatum(postdatum)}

        <br>

        \+ 4 Tage →
        ${formatDatum(bekanntgabe)}

        <br>

        <strong>
        Bekanntgabe:
        ${formatDatum(bekanntgabe)}
        </strong>

        <br><br>


        <strong>2. Fristbeginn</strong><br>

        Der Tag der Bekanntgabe wird nicht mitgerechnet.

        <br>

        Fristbeginn:
        ${formatDatum(fristbeginn)}

        <br><br>


        <strong>3. Einspruchsfrist (§ 355 AO)</strong><br>

        Die Einspruchsfrist beträgt einen Monat.

    `;


    if (fristendeVerschoben) {

        text += `

            <br><br>

            <strong>4. Verschiebung nach § 108 Abs. 3 AO</strong><br>

            Das rechnerische Fristende fällt auf einen
            Samstag, Sonntag oder gesetzlichen Feiertag.

            <br>

            Daher Verschiebung auf den nächsten Werktag.

        `;

    }


    text += `

        <br><br>

        <strong>
        Fristende:
        ${formatDatum(fristende)}
        </strong>

    `;


    document.getElementById("erklaerung").innerHTML =
        text;


    document.getElementById("result").style.display =
        "block";

}


/*
=========================================================
HEUTIGES DATUM AUTOMATISCH EINTRAGEN
=========================================================
*/

window.addEventListener(
    "DOMContentLoaded",
    function() {

        const heute = new Date();

        const jahr =
            heute.getFullYear();

        const monat =
            String(
                heute.getMonth() + 1
            ).padStart(2, "0");

        const tag =
            String(
                heute.getDate()
            ).padStart(2, "0");


        document.getElementById(
            "postdatum"
        ).value =
            `${jahr}-${monat}-${tag}`;

    }
);

</script>

</body>
</html>
